image:
  repository: ghcr.io/your-org/devhub
  tag: ""            # defaults to the chart's appVersion
  # Pin the exact image you verified (cosign verify ...), e.g. sha256:4f2c...; overrides tag.
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Where Dev Hub keeps its data:
#   sqlite   - a file on a persistent volume. One replica, Recreate upgrades (brief downtime).
#   postgres - put DATABASE_URL (postgres://user:pass@host:5432/devhub) in the Secret.
#              No volume; run several replicas with rolling upgrades.
database:
  type: sqlite
replicaCount: 1

# Used only with database.type=sqlite.
persistence:
  enabled: true
  size: 2Gi
  storageClass: ""   # cluster default when empty
  existingClaim: ""

# Non-secret settings, rendered into /etc/devhub/devhub.config.json.
# See devhub.config.example.json in the app for every key.
config:
  publicUrl: https://devhub.example.com
  claudeGatewayUrl: ""
  auth:
    oidc:
      issuer: ""          # e.g. https://acme.okta.com/oauth2/default
      clientId: ""
      adminGroup: devhub-admins
      groupsClaim: groups
    devLogin: false
    jitProvisioning: true
    allowedEmailDomains: []
  wallet:
    defaultMonthlyBudgetUsd: 300
    warnAt: 0.8
  connectors: {}
  #  claude:  { mode: gateway, baseUrl: https://claude-gateway.internal, enforceCaps: true }
  #  copilot: { org: acme, apiUrl: https://api.github.com, seatPriceUsd: { business: 19, enterprise: 39 } }
  #  cursor:  { apiUrl: https://api.cursor.com }
  syncIntervalSeconds: 300

# Secrets are read from a Kubernetes Secret as environment variables. Either point at a
# Secret you manage (recommended: External Secrets, Vault, SOPS) or let the chart create
# one from `secrets.values` (fine for evaluation; the values end up in Helm's release data).
secrets:
  existingSecret: ""
  values: {}
  # Recognized keys:
  #   DATABASE_URL (with database.type=postgres), OIDC_CLIENT_SECRET, CLAUDE_ADMIN_KEY, GITHUB_TOKEN, CURSOR_API_KEY,
  #   DEVHUB_ADMIN_TOKEN, DEVHUB_SCIM_TOKEN, DEVHUB_SLACK_WEBHOOK_URL, DEVHUB_LICENSE,
  #   SMTP_URL (budget alert emails), DEVHUB_EMAIL_FROM, DEVHUB_POLICY_TOKEN (policy helper),
  #   CODER_SESSION_TOKEN (Coder workspaces)
  # Workspace backends go under config.workspaces: { aws: { region }, gcp: { project }, coder: { url } }.

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: devhub.example.com
  tls:
    enabled: true
    secretName: devhub-tls

resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { memory: 512Mi }

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

serviceAccount:
  create: true
  name: ""
  # For cloud workspaces on AWS, give Dev Hub an IAM role, e.g. with IRSA:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/devhub
  annotations: {}
