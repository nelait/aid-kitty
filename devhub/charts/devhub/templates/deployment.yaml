apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "devhub.fullname" . }}
  labels: {{- include "devhub.labels" . | nindent 4 }}
{{- $pg := eq .Values.database.type "postgres" }}
{{- if not (has .Values.database.type (list "sqlite" "postgres")) }}
{{- fail "database.type must be sqlite or postgres" }}
{{- end }}
{{- if and (not $pg) (gt (int .Values.replicaCount) 1) }}
{{- fail "SQLite supports one replica; set database.type=postgres to run more" }}
{{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    {{- if $pg }}
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
    {{- else }}
    type: Recreate   # SQLite: exactly one writer
    {{- end }}
  selector:
    matchLabels: {{- include "devhub.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "devhub.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "devhub.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: devhub
          {{- if .Values.image.digest }}
          {{- if not (regexMatch "^sha256:[a-f0-9]{64}$" .Values.image.digest) }}
          {{- fail "image.digest must look like sha256:<64 hex characters>" }}
          {{- end }}
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          {{- else }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8787
          env:
            - name: PORT
              value: "8787"
            {{- if not $pg }}
            - name: DEVHUB_DB
              value: /data/devhub.db
            {{- end }}
            - name: DEVHUB_CONFIG
              value: /etc/devhub/devhub.config.json
          {{- if or .Values.secrets.existingSecret .Values.secrets.values }}
          envFrom:
            - secretRef:
                name: {{ include "devhub.secretName" . }}
          {{- end }}
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- if not $pg }}
            - name: data
              mountPath: /data
            {{- end }}
            - name: config
              mountPath: /etc/devhub
              readOnly: true
            - name: tmp
              mountPath: /tmp
        {{- if .Values.gcpMarketplace.enabled }}
        # Google Cloud Marketplace metering agent (usage reports for billing).
        - name: ubbagent
          image: {{ .Values.gcpMarketplace.ubbagentImage | quote }}
          env:
            - name: AGENT_CONFIG_FILE
              value: /etc/ubbagent/config.yaml
            - name: AGENT_LOCAL_PORT
              value: "6080"
            - name: AGENT_STATE_DIR
              value: /var/lib/ubbagent
            - name: AGENT_REPORT_DIR
              value: /var/lib/ubbagent/reports
            - name: AGENT_ENCODED_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gcpMarketplace.reportingSecret }}
                  key: reporting-key
            - name: AGENT_CONSUMER_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gcpMarketplace.reportingSecret }}
                  key: consumer-id
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - name: ubbagent-config
              mountPath: /etc/ubbagent
              readOnly: true
            - name: ubbagent-state
              mountPath: /var/lib/ubbagent
              subPath: ubbagent
        {{- end }}
      volumes:
        {{- if not $pg }}
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (include "devhub.fullname" .) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
        - name: config
          configMap:
            name: {{ include "devhub.fullname" . }}
        - name: tmp
          emptyDir: {}
        {{- if .Values.gcpMarketplace.enabled }}
        - name: ubbagent-config
          configMap:
            name: {{ include "devhub.fullname" . }}-ubbagent
        # Usage the agent hasn't delivered yet. With SQLite it shares the data volume so it survives restarts.
        - name: ubbagent-state
          {{- if and (not $pg) .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (include "devhub.fullname" .) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
