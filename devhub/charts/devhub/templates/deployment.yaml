apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "devhub.fullname" . }}
  labels: {{- include "devhub.labels" . | nindent 4 }}
{{- $pg := eq .Values.database.type "postgres" }}
{{- if not (has .Values.database.type (list "sqlite" "postgres")) }}
{{- fail "database.type must be sqlite or postgres" }}
{{- end }}
{{- if and (not $pg) (gt (int .Values.replicaCount) 1) }}
{{- fail "SQLite supports one replica; set database.type=postgres to run more" }}
{{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    {{- if $pg }}
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
    {{- else }}
    type: Recreate   # SQLite: exactly one writer
    {{- end }}
  selector:
    matchLabels: {{- include "devhub.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "devhub.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "devhub.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: devhub
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8787
          env:
            - name: PORT
              value: "8787"
            {{- if not $pg }}
            - name: DEVHUB_DB
              value: /data/devhub.db
            {{- end }}
            - name: DEVHUB_CONFIG
              value: /etc/devhub/devhub.config.json
          {{- if or .Values.secrets.existingSecret .Values.secrets.values }}
          envFrom:
            - secretRef:
                name: {{ include "devhub.secretName" . }}
          {{- end }}
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- if not $pg }}
            - name: data
              mountPath: /data
            {{- end }}
            - name: config
              mountPath: /etc/devhub
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        {{- if not $pg }}
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (include "devhub.fullname" .) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
        - name: config
          configMap:
            name: {{ include "devhub.fullname" . }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
