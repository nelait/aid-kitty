name: devhub

on:
  pull_request:
    paths:
      - "devhub/**"
      - ".github/workflows/devhub.yml"
  push:
    branches: [main]
    paths:
      - "devhub/**"
      - ".github/workflows/devhub.yml"
    tags: ["devhub-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devhub-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: devhub

jobs:
  test:
    name: test (${{ matrix.database }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Empty for the SQLite run, so the suite uses in-memory SQLite.
      DEVHUB_TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgres://postgres:postgres@localhost:5432/postgres' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: devhub/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  helm:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Lint (SQLite and Postgres modes)
        run: |
          helm lint charts/devhub --strict
          helm lint charts/devhub --strict --set database.type=postgres --set replicaCount=3
      - name: Render
        run: |
          helm template devhub charts/devhub > /dev/null
          helm template devhub charts/devhub --set database.type=postgres --set replicaCount=3 \
            --set secrets.existingSecret=devhub --set ingress.enabled=true > /dev/null
      - name: SQLite with two replicas is refused
        run: |
          if helm template devhub charts/devhub --set replicaCount=2 > /dev/null 2>&1; then
            echo "expected the chart to refuse SQLite with 2 replicas" >&2
            exit 1
          fi

  terraform:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive terraform
      - name: Validate example and module
        working-directory: devhub/terraform/examples/basic
        run: |
          terraform init -backend=false -input=false
          terraform validate

  image:
    needs: [test, helm, terraform]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/devhub
          tags: |
            type=sha,format=short
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=match,pattern=devhub-v(.*),group=1
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Pull requests build the image to prove it builds; only main and devhub-v* tags publish it.
      - uses: docker/build-push-action@v6
        with:
          context: devhub
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the image
        run: |
          # run steps start in devhub/ (see defaults), so the build context is "."
          docker build -q -t devhub:ci . > /dev/null
          docker run -d --name devhub -p 8787:8787 -e DEVHUB_ADMIN_TOKEN=ci devhub:ci
          for i in $(seq 1 30); do
            curl -fsS localhost:8787/healthz && exit 0
            sleep 1
          done
          docker logs devhub
          exit 1
